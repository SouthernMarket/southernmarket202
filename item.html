<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item — Southern Market 202</title>
    <meta name="description" content="">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @font-face {
            font-family: 'Horizon';
            src: url('fonts/Horizon.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --black:  #0a0a0a;
            --white:  #ffffff;
            --gray:   #6b6b6b;
            --light:  #f5f5f5;
            --border: #e0e0e0;
        }

        body { font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif; background: var(--white); color: var(--black); }

        /* ── WORDMARK ── */
        .wordmark { display: inline-flex; flex-direction: column; line-height: 1; text-decoration: none; gap: 3px; }
        .wm-top { font-family: 'Horizon', sans-serif; font-size: 22px; color: var(--black); letter-spacing: 0; text-transform: uppercase; line-height: 1; white-space: nowrap; }
        .wm-bot { font-family: 'Horizon', sans-serif; font-size: 13px; color: var(--black); letter-spacing: 5.5px; text-transform: uppercase; line-height: 1; white-space: nowrap; }
        .wordmark.light .wm-top, .wordmark.light .wm-bot { color: var(--white); }

        /* ── HEADER ── */
        header { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 48px; height: 80px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; position: sticky; top: 0; z-index: 200; }
        nav { display: flex; gap: 40px; align-items: center; justify-content: center; }
        nav a { font-family: 'Horizon', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--black); text-decoration: none; transition: color 0.2s; }
        nav a:hover, nav a.active { color: var(--gray); }
        .header-right { display: flex; justify-content: flex-end; align-items: center; gap: 16px; }
        .header-social { display: flex; gap: 14px; align-items: center; }
        .header-social a { display: flex; color: var(--black); transition: opacity 0.2s; }
        .header-social a:hover { opacity: 0.4; }
        .header-social svg { width: 17px; height: 17px; fill: currentColor; }
        .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; background: none; border: none; }
        .hamburger span { display: block; width: 24px; height: 2px; background: var(--black); transition: all 0.3s; }
        .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
        .mobile-menu { display: none; position: fixed; top: 80px; left: 0; right: 0; background: var(--white); border-bottom: 1px solid var(--border); z-index: 199; padding: 24px 32px; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
        .mobile-menu.open { display: flex; }
        .mobile-menu a { font-family: 'Horizon', sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--black); text-decoration: none; padding: 16px 0; border-bottom: 1px solid var(--border); transition: color 0.2s; }
        .mobile-menu a:last-child { border-bottom: none; }
        .mobile-menu a:hover { color: var(--gray); }
        .mobile-social { display: flex; gap: 16px; padding-top: 20px; }
        .mobile-social a { display: flex; color: var(--black); }
        .mobile-social svg { width: 20px; height: 20px; fill: currentColor; }

        /* ── BREADCRUMB ── */
        .breadcrumb {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 48px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--gray);
        }
        .breadcrumb a { color: var(--gray); text-decoration: none; transition: color 0.2s; }
        .breadcrumb a:hover { color: var(--black); }
        .breadcrumb span { color: #ccc; }

        /* ── ITEM LAYOUT ── */
        .item-wrap { max-width: 1200px; margin: 0 auto; padding: 0 48px 96px; }

        .item-grid { display: grid; grid-template-columns: 1fr 420px; gap: 80px; align-items: start; }

        /* ── PHOTO ── */
        .item-photo-wrap { position: sticky; top: 108px; }

        .item-photo { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; border: 1px solid var(--border); }

        .item-photo-placeholder { width: 100%; aspect-ratio: 4/3; background: var(--black); display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }

        .item-photo-placeholder svg { opacity: 0.2; }

        .sold-strip { background: #c0392b; color: var(--white); text-align: center; padding: 12px; font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-top: 12px; }

        /* ── PHOTO GALLERY ── */
        .item-photo-main {
            width: 100%;
            max-height: 560px;
            object-fit: contain;
            background: #f2f0ec;
            display: block;
            border: 1px solid var(--border);
            cursor: zoom-in;
            transition: opacity 0.15s;
        }

        .item-thumb-strip {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .item-thumb-strip::-webkit-scrollbar { height: 4px; }
        .item-thumb-strip::-webkit-scrollbar-track { background: var(--border); }
        .item-thumb-strip::-webkit-scrollbar-thumb { background: var(--gray); }

        .item-thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 2px solid var(--border);
            cursor: pointer;
            flex-shrink: 0;
            transition: border-color 0.15s, opacity 0.15s;
            opacity: 0.6;
        }

        .item-thumb:hover { opacity: 1; }
        .item-thumb.active { border-color: var(--black); opacity: 1; }

        /* ── LIGHTBOX ── */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }
        .lightbox.open { display: flex; }

        .lightbox img {
            max-width: 92vw;
            max-height: 92vh;
            object-fit: contain;
            display: block;
            cursor: default;
        }

        .lightbox-close {
            position: fixed;
            top: 20px;
            right: 28px;
            color: white;
            font-size: 36px;
            font-weight: 300;
            cursor: pointer;
            line-height: 1;
            opacity: 0.75;
            transition: opacity 0.15s;
            background: none;
            border: none;
        }
        .lightbox-close:hover { opacity: 1; }

        .lightbox-prev, .lightbox-next {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.12);
            border: none;
            color: white;
            font-size: 28px;
            padding: 16px 20px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .lightbox-prev { left: 16px; }
        .lightbox-next { right: 16px; }
        .lightbox-prev:hover, .lightbox-next:hover { background: rgba(255,255,255,0.25); }

        /* ── ITEM DETAILS ── */
        .item-details { padding-top: 8px; }

        .item-eyebrow { font-family: 'Horizon', sans-serif; font-size: 10px; font-weight: normal; letter-spacing: 3px; text-transform: uppercase; color: var(--gray); margin-bottom: 16px; }

        .item-title { font-family: 'Horizon', sans-serif; font-size: 36px; color: var(--black); letter-spacing: 1px; line-height: 1.15; margin-bottom: 20px; text-transform: uppercase; }

        .item-price { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 36px; font-weight: 800; color: var(--black); letter-spacing: -1px; margin-bottom: 32px; }

        /* ── SPECS ── */
        .item-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); margin-bottom: 40px; }

        .spec-cell { background: var(--white); padding: 16px 20px; }

        .spec-label { font-family: 'Horizon', sans-serif; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); margin-bottom: 4px; }

        .spec-value { font-size: 14px; font-weight: 600; color: var(--black); }

        /* ── STORY ── */
        .item-story-label { font-family: 'Horizon', sans-serif; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--gray); margin-bottom: 16px; }

        .item-story { font-size: 16px; color: var(--gray); line-height: 1.85; margin-bottom: 40px; white-space: pre-wrap; }

        /* ── DIVIDER ── */
        .divider { border: none; border-top: 1px solid var(--border); margin: 40px 0; }

        /* ── INTEREST FORM ── */
        .interest-title { font-family: 'Horizon', sans-serif; font-size: 22px; color: var(--black); letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }

        .interest-sub { font-size: 14px; color: var(--gray); line-height: 1.65; margin-bottom: 28px; }

        .form-group { margin-bottom: 16px; }

        .form-group label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--black); margin-bottom: 8px; }

        .form-group input,
        .form-group textarea {
            width: 100%;
            border: 1px solid var(--border);
            padding: 12px 14px;
            font-size: 14px;
            font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif;
            color: var(--black);
            background: var(--white);
            transition: border-color 0.2s;
            outline: none;
            border-radius: 0;
            -webkit-appearance: none;
        }

        .form-group input:focus,
        .form-group textarea:focus { border-color: var(--black); }

        .form-group textarea { height: 120px; resize: vertical; }

        .optional-label { font-weight: 400; color: var(--gray); text-transform: none; letter-spacing: 0; font-size: 11px; }

        .submit-btn { width: 100%; background: var(--black); color: var(--white); border: none; padding: 16px; font-family: 'Horizon', sans-serif; font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; cursor: pointer; transition: background 0.2s; margin-top: 8px; }

        .submit-btn:hover { background: #333; }
        .submit-btn:disabled { background: #aaa; cursor: not-allowed; }

        .form-success { display: none; background: var(--black); color: var(--white); padding: 24px 28px; margin-top: 16px; }

        .form-success h4 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .form-success p { font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.6; }

        .form-error { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }

        /* ── NOT FOUND ── */
        .not-found { text-align: center; padding: 120px 48px; }
        .not-found h2 { font-family: 'Horizon', sans-serif; font-size: 48px; font-weight: normal; color: var(--black); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .not-found p { font-size: 15px; color: var(--gray); margin-bottom: 32px; }
        .not-found a { display: inline-block; background: var(--black); color: var(--white); padding: 14px 28px; font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; text-decoration: none; }

        /* ── FOOTER ── */
        footer { background: var(--black); border-top: 1px solid rgba(255,255,255,0.1); padding: 48px; display: flex; justify-content: space-between; align-items: center; }
        .footer-copy { font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: 0.3px; }
        .footer-social { display: flex; gap: 16px; }
        .footer-social a { color: rgba(255,255,255,0.4); transition: color 0.2s; }
        .footer-social a:hover { color: var(--white); }
        .footer-social svg { width: 18px; height: 18px; fill: currentColor; }

        /* ── MOBILE ── */
        @media (max-width: 900px) {
            .item-grid { grid-template-columns: 1fr; gap: 32px; }
            .item-photo-wrap { position: static; }
            .item-title { font-size: 24px; letter-spacing: 0; }
            .item-photo-main { max-height: 340px; }
            .interest-title { font-size: 18px; letter-spacing: 0; }
        }

        @media (max-width: 768px) {
            header { padding: 0 20px; grid-template-columns: 1fr auto; }
            nav { display: none; }
            .header-social { display: none; }
            .hamburger { display: flex; }
            .breadcrumb { padding: 12px 20px; font-size: 10px; }
            .item-wrap { padding: 0 20px 64px; }
            .item-specs { grid-template-columns: 1fr; }
            .item-title { font-size: 22px; }
            .item-price { font-size: 28px; }
            footer { flex-direction: column; gap: 24px; text-align: center; padding: 40px 24px; }
        }
    </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://cljkimiocyodlyrlxkjl.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsamtpbWlvY3lvZGx5cmx4a2psIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzODI4NTUsImV4cCI6MjA5NDk1ODg1NX0.oQ6v5iKSzUGY9cNwv1lUfAFJeqiJAwRQnu6R0bsx2Uw';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentListing = null;

    function toggleMenu() {
        document.getElementById('mobile-menu').classList.toggle('open');
        document.getElementById('hamburger').classList.toggle('open');
    }

    function formatPrice(price) {
        return '$' + parseFloat(price).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    async function loadItem() {
        const slug = new URLSearchParams(window.location.search).get('slug');
        const container = document.getElementById('item-content');

        if (!slug) {
            renderNotFound(container);
            return;
        }

        const { data, error } = await db
            .from('listings')
            .select('*')
            .eq('slug', slug)
            .single();

        if (error || !data) {
            renderNotFound(container);
            return;
        }

        currentListing = data;

        document.title = `${data.title} — Southern Market 202`;
        document.querySelector('meta[name="description"]').setAttribute('content',
            data.excerpt || `${data.title} — available at Southern Market 202 in Williamston, SC.`);

        const specsHTML = buildSpecs(data);

        // Parse image_url — could be a plain URL string or a JSON array of URLs
        let photoUrls = [];
        if (data.image_url) {
            try {
                const parsed = JSON.parse(data.image_url);
                if (Array.isArray(parsed)) photoUrls = parsed;
                else photoUrls = [data.image_url];
            } catch {
                photoUrls = [data.image_url];
            }
        }

        // Make URLs available to lightbox functions
        galleryUrls = photoUrls;
        lightboxIndex = 0;

        const galleryHTML = photoUrls.length > 0
            ? `<img src="${photoUrls[0]}" alt="${data.title}" class="item-photo-main" id="main-photo"
                    onclick="openLightbox(lightboxIndex)" title="Click to zoom">
               ${photoUrls.length > 1
                   ? `<div class="item-thumb-strip">
                          ${photoUrls.map((url, i) =>
                              `<img src="${url}" alt="${data.title} — photo ${i+1}"
                                    class="item-thumb ${i === 0 ? 'active' : ''}"
                                    onclick="switchPhoto(this, '${url}', ${i})">`
                          ).join('')}
                      </div>`
                   : ''
               }`
            : `<div class="item-photo-placeholder">
                   <svg width="80" height="80" viewBox="0 0 48 48" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                       <rect x="6" y="10" width="36" height="28" rx="1"/>
                       <circle cx="18" cy="21" r="5"/>
                       <path d="M6 34 L15 25 L22 32 L30 24 L42 34"/>
                   </svg>
               </div>`;

        container.innerHTML = `
            <div class="breadcrumb">
                <a href="shop.html">Shop</a>
                <span>›</span>
                <span>${data.title}</span>
            </div>

            <div class="item-wrap">
                <div class="item-grid">
                    <div class="item-photo-wrap">
                        ${galleryHTML}
                        ${data.sold ? '<div class="sold-strip">This item has been sold</div>' : ''}
                    </div>

                    <div class="item-details">
                        <p class="item-eyebrow">${data.category || 'Vintage'}</p>
                        <h1 class="item-title">${data.title}</h1>
                        <p class="item-price">${formatPrice(data.price)}</p>

                        ${specsHTML}

                        ${data.story ? `
                            <p class="item-story-label">The Story</p>
                            <p class="item-story">${data.story}</p>
                        ` : ''}

                        <hr class="divider">

                        ${data.sold ? `
                            <div style="background:#fdf2f2;border:1px solid #f5c6c6;padding:24px 28px;">
                                <h3 style="font-size:18px;font-weight:800;color:#c0392b;margin-bottom:8px;">This item has been sold</h3>
                                <p style="font-size:14px;color:#666;line-height:1.6;">Check back soon — we're always finding new pieces. <a href="shop.html" style="color:#2B3A5C;font-weight:700;">View current items →</a></p>
                            </div>
                        ` : `
                            <div class="interest-section">
                                <h2 class="interest-title">I'm interested in this</h2>
                                <p class="interest-sub">Leave your info and we'll reach out personally to answer any questions and arrange a time to connect.</p>

                                <form id="interest-form" onsubmit="submitInquiry(event)">
                                    <div class="form-group">
                                        <label for="inq-name">Your Name</label>
                                        <input type="text" id="inq-name" placeholder="First and last name" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="inq-email">Email Address</label>
                                        <input type="email" id="inq-email" placeholder="you@email.com" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="inq-phone">Phone Number <span class="optional-label">(optional)</span></label>
                                        <input type="tel" id="inq-phone" placeholder="(555) 000-0000">
                                    </div>
                                    <div class="form-group">
                                        <label for="inq-message">Message <span class="optional-label">(optional)</span></label>
                                        <textarea id="inq-message" placeholder="Any questions about the piece, dimensions, condition, etc."></textarea>
                                    </div>
                                    <button type="submit" class="submit-btn" id="inq-submit">Send My Interest</button>
                                    <p class="form-error" id="inq-error">Something went wrong. Please try again.</p>
                                </form>

                                <div class="form-success" id="inq-success">
                                    <h4>We got your message!</h4>
                                    <p>Thanks for your interest in <strong>${data.title}</strong>. We'll be in touch soon to talk through the details.</p>
                                </div>
                            </div>
                        `}
                    </div>
                </div>
            </div>
        `;
    }

    function buildSpecs(data) {
        const specs = [];
        if (data.condition)          specs.push(['Condition', data.condition]);
        if (data.category)           specs.push(['Category', data.category]);
        if (data.dimensions)         specs.push(['Dimensions', data.dimensions]);
        if (data.restoration_notes)  specs.push(['Restoration', data.restoration_notes]);
        if (!specs.length) return '';

        return `<div class="item-specs">
            ${specs.map(([label, value]) => `
                <div class="spec-cell">
                    <p class="spec-label">${label}</p>
                    <p class="spec-value">${value}</p>
                </div>
            `).join('')}
        </div>`;
    }

    async function submitInquiry(e) {
        e.preventDefault();

        const btn    = document.getElementById('inq-submit');
        const errEl  = document.getElementById('inq-error');
        btn.textContent = 'Sending...';
        btn.disabled = true;
        errEl.style.display = 'none';

        const name    = document.getElementById('inq-name').value.trim();
        const email   = document.getElementById('inq-email').value.trim();
        const phone   = document.getElementById('inq-phone').value.trim();
        const message = document.getElementById('inq-message').value.trim();

        const { error: dbError } = await db.from('inquiries').insert({
            listing_id:    currentListing.id,
            listing_title: currentListing.title,
            name, email, phone,
            message: message || `I'm interested in the ${currentListing.title}.`,
        });

        if (dbError) {
            btn.textContent = 'Send My Interest';
            btn.disabled = false;
            errEl.style.display = 'block';
            return;
        }

        try {
            await fetch(`${SUPABASE_URL}/functions/v1/send-inquiry-email`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                body: JSON.stringify({
                    listing_title: currentListing.title,
                    listing_slug:  currentListing.slug,
                    price:         currentListing.price,
                    name, email, phone,
                    message: message || `I'm interested in the ${currentListing.title}.`,
                }),
            });
        } catch (_) {
            // Email failure is non-fatal — inquiry is already saved
        }

        document.getElementById('interest-form').style.display = 'none';
        document.getElementById('inq-success').style.display = 'block';
    }

    let galleryUrls = [];
    let lightboxIndex = 0;

    function switchPhoto(thumbEl, url, index) {
        document.getElementById('main-photo').src = url;
        lightboxIndex = index;
        document.querySelectorAll('.item-thumb').forEach(t => t.classList.remove('active'));
        thumbEl.classList.add('active');
    }

    function openLightbox(index) {
        lightboxIndex = index;
        document.getElementById('lightbox-img').src = galleryUrls[lightboxIndex];
        document.getElementById('lightbox').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('open');
        document.body.style.overflow = '';
    }

    function lightboxNav(dir) {
        lightboxIndex = (lightboxIndex + dir + galleryUrls.length) % galleryUrls.length;
        document.getElementById('lightbox-img').src = galleryUrls[lightboxIndex];
        // Sync main photo and active thumb
        document.getElementById('main-photo').src = galleryUrls[lightboxIndex];
        document.querySelectorAll('.item-thumb').forEach((t, i) => {
            t.classList.toggle('active', i === lightboxIndex);
        });
    }

    // Close lightbox with Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') { if (document.getElementById('lightbox').classList.contains('open')) lightboxNav(1); }
        if (e.key === 'ArrowLeft')  { if (document.getElementById('lightbox').classList.contains('open')) lightboxNav(-1); }
    });

    function renderNotFound(container) {
        container.innerHTML = `
            <div class="not-found">
                <h2>Item Not Found</h2>
                <p>This item may have been sold or removed. Browse what's currently available.</p>
                <a href="shop.html">Back to Shop</a>
            </div>
        `;
    }

    loadItem();
</script>

</body>
</html>
